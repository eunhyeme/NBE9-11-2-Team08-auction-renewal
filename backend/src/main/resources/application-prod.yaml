spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
