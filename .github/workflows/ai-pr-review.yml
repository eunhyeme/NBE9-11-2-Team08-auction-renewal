name: Team08 AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > review_script.py
          import os
          from google import genai
          import subprocess

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          
          # 1. 변경된 파일 목록 및 전체 내용 가져오기 (맥락 파악용) ⚾️
          try:
              changed_files = subprocess.check_output(["git", "diff", "--name-only", "origin/${{ github.base_ref }}...HEAD"]).decode("utf-8").splitlines()
              full_context = ""
              for file in changed_files:
                  if os.path.exists(file) and file.endswith(('.java', '.ts', '.tsx', '.yaml', '.yml')):
                      with open(file, 'r', encoding='utf-8') as f:
                          full_context += f"\n--- Full File Content: {file} ---\n{f.read()}\n"
              
              diff = subprocess.check_output(["git", "diff", "origin/${{ github.base_ref }}...HEAD"]).decode("utf-8")
          except:
              diff = "데이터 가져오기 실패"
              full_context = ""

          # 2. 시니어 개발자 페르소나 적용 📈
          prompt = f"""
          너는 숙련된 시니어 백엔드 개발자야. 이 PR의 변경사항을 리뷰해줘.

          [리뷰 가이드라인]
          1. 실질적 로직 집중: Java 버전, record 사용 여부 등 이미 적용된 기초 규칙에 대한 중복 조언은 절대 하지 마. 
          2. 전체 맥락 파악: 제공된 'Full File Content'를 먼저 읽고, 파일의 전체 구조 안에서 변경사항(Diff)이 적절한지 판단해.
          3. 비즈니스 로직 및 보안: 예외 처리 누락, 성능 저하 가능성, 보안 취약점을 중점적으로 지적해줘.
          4. 건설적인 피드백: 지적 사항에는 반드시 구체적인 이유와 시니어다운 개선 코드 예시를 포함해줘.

          분석 데이터:
          [수정된 파일의 전체 코드]
          {full_context}

          [변경 사항 (Diff)]
          {diff}
          """

          try:
              response = client.models.generate_content(
                  model='models/gemini-2.5-flash-lite', 
                  contents=prompt
              )
              with open("review_message.txt", "w", encoding="utf-8") as f:
                  f.write(response.text)
          except Exception as e:
              with open("review_message.txt", "w", encoding="utf-8") as f:
                  f.write(f"⚠️ AI 리뷰어 실행 오류: {e}")
          EOF
          python review_script.py
          gh pr comment ${{ github.event.pull_request.number }} --body-file=review_message.txt