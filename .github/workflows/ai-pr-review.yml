name: Team08 AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > review_script.py
          import os
          import json
          from google import genai
          import subprocess

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          # 1. 변경된 파일 목록 및 전체 내용 가져오기
          try:
              changed_files = subprocess.check_output(["git", "diff", "--name-only", "origin/${{ github.base_ref }}...HEAD"]).decode("utf-8").splitlines()
              full_context = ""
              for file in changed_files:
                  if os.path.exists(file) and file.endswith(('.java', '.ts', '.tsx', '.yaml', '.yml')):
                      with open(file, 'r', encoding='utf-8') as f:
                          full_context += f"\n--- Full File Content: {file} ---\n{f.read()}\n"

              diff = subprocess.check_output(["git", "diff", "origin/${{ github.base_ref }}...HEAD"]).decode("utf-8")
          except:
              diff = "데이터 가져오기 실패"
              full_context = ""

          # 2. 프롬프트
          prompt = f"""
          너는 숙련된 시니어 백엔드 개발자야. 아래 PR의 변경사항을 실무 기준으로 리뷰해줘.

          [프로젝트 환경 - 절대 이 버전 이하 문법이나 방식을 권장하지 마]
          - Java 25
          - Spring Boot 4.0 이상
          - record, sealed class, pattern matching 등 최신 문법 적극 활용 중

          [리뷰 원칙]
          1. Diff에서 실제로 변경된 부분에만 집중해. 변경되지 않은 기존 코드의 문제는 지적하지 마.
          2. 같은 지적을 반복하지 마. 이미 반영된 내용이 보이면 "개선됨"으로 짧게 언급하고 넘어가.
          3. 중요도 기준을 엄격하게 적용해:
            - 🔴 반드시 수정 (보안 취약점, 데이터 정합성 오류, 심각한 버그)
            - 🟡 권장 수정 (성능 저하, 예외 처리 누락, 유지보수 문제)
            - 🟢 선택적 개선 (가독성, 네이밍 등 사소한 스타일)
            - 🟢는 최대 2개까지만 작성하고, 사소한 건 생략해도 됨.
          4. 지적할 때는 반드시 이유와 개선 코드 예시를 함께 제시해.
          5. 전체적으로 문제가 없으면 "특이사항 없음"으로 짧게 종료해.

          [수정된 파일의 전체 코드 - 맥락 파악용]
          {full_context}

          [변경 사항 (Diff) - 리뷰 대상]
          {diff}
          """

          # 3. Gemini 호출
          try:
              response = client.models.generate_content(
                  model='models/gemini-2.5-flash-lite',
                  contents=prompt
              )
              body = response.text
          except Exception as e:
              body = f"⚠️ AI 리뷰어 실행 오류: {e}"

          # 4. 기존 봇 코멘트 찾아서 수정, 없으면 새로 작성
          pr_number = "${{ github.event.pull_request.number }}"
          repo = "${{ github.repository }}"

          try:
              comments_json = subprocess.check_output([
                  "gh", "api", f"repos/{repo}/issues/{pr_number}/comments"
              ]).decode("utf-8")
              comments = json.loads(comments_json)
              bot_comment = next(
                  (c for c in comments if c["user"]["login"] == "github-actions[bot]"),
                  None
              )
          except:
              bot_comment = None

          with open("review_message.txt", "w", encoding="utf-8") as f:
              f.write(body)

          if bot_comment:
              import json as _json
              with open("patch_body.json", "w", encoding="utf-8") as f:
                  _json.dump({"body": body}, f, ensure_ascii=False)
              subprocess.run([
                  "gh", "api", f"repos/{repo}/issues/comments/{bot_comment['id']}",
                  "-X", "PATCH", "--input", "patch_body.json"
              ])
          else:
              subprocess.run([
                  "gh", "pr", "comment", pr_number, "--body-file", "review_message.txt"
              ])
          EOF
          python review_script.py