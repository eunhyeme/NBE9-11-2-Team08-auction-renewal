name: Team08 AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > review_script.py
          import os
          from google import genai
          import subprocess

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          
          # 1. PR 변경 사항 가져오기
          try:
              diff = subprocess.check_output(["git", "diff", "origin/${{ github.base_ref }}...HEAD"]).decode("utf-8")
          except:
              diff = "변경 사항 가져오기 실패"

          # 2. 8팀 시니어 사수 가이드라인 (100% 반영)
          prompt = f"""
          너는 '프로그래머스 데브코스 백엔드 8팀'의 시니어 백엔드 개발자이자 리뷰어야. 
          아래 가이드라인에 따라 한국어로 리뷰를 작성해줘.

          1. 기본 원칙: 잘못된 구현은 지적하고 구체적인 정답 코드를 제시할 것.
          2. 컨벤션: Java 17+, record 타입 사용, 정적 팩토리 메서드(from) 확인.
          3. DB/도메인: @Version 필드 확인, Soft Delete(deleted_at) 방식 확인.
          4. 스타일: 전문적이고 단호하면서 건설적인 톤 유지.

          코드 변경사항:
          {diff}
          """

          try:
              # 💡 로그에서 확인된 2026년 신규 유저용 표준 모델 적용
              response = client.models.generate_content(
                  model='models/gemini-2.5-flash', 
                  contents=prompt
              )
              with open("review_message.txt", "w", encoding="utf-8") as f:
                  f.write(response.text)
          except Exception as e:
              with open("review_message.txt", "w", encoding="utf-8") as f:
                  f.write(f"⚠️ AI 리뷰어 실행 오류: {e}")
          EOF
          python review_script.py
          gh pr comment ${{ github.event.pull_request.number }} --body-file=review_message.txt