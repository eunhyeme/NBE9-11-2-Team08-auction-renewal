services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: k6test
      MYSQL_USER: k6user
      MYSQL_PASSWORD: k6pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod,k6
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/k6test?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: k6user
      SPRING_DATASOURCE_PASSWORD: k6pass
      JWT_SECRET: k6-test-jwt-secret-must-be-32chars!!
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./k6/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb

  k6:
    image: grafana/k6:latest
    depends_on:
      backend:
        condition: service_healthy
      influxdb:
        condition: service_started
    environment:
      BASE_URL: http://backend:8080
    volumes:
      - ./k6/scripts:/scripts
      - ./k6/results:/results
    # 기본값: load-test. 다른 시나리오 실행 시 command 오버라이드:
    # docker compose -f docker-compose.k6.yml run --rm k6 \
    #   run --out influxdb=http://influxdb:8086/k6 /scripts/stress-test.js
    # command: run --out influxdb=http://influxdb:8086/k6 /scripts/load-test.js
    command: run --out influxdb=http://influxdb:8086/k6 /scripts/bid-concurrency-test.js
